<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>box box box</title>
    <style>
          @font-face {
              font-family: 'D2Coding';
              src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_three@1.0/D2Coding.woff') format('woff');
              font-weight: normal;
              font-display: swap;
          }

          html, body {
              margin: 0;
              height: 100%;
              overflow: hidden;
              background: #FFF;
          }

          .background {
              position: fixed;
              inset: 0;
          }

          .box {
              position: absolute;
              inset: calc(var(--box) * 4vmin);
          }

          .box:nth-child(1) { --box:0; }
          .box:nth-child(2) { --box:1; }
          .box:nth-child(3) { --box:2; }
          .box:nth-child(4) { --box:3; }
          .box:nth-child(5) { --box:4; }
          .box:nth-child(6) { --box:5; }
          .box:nth-child(7) { --box:6; }
          .box:nth-child(8) { --box:7; }
          .box:nth-child(9) { --box:8; }
          .box:nth-child(10) { --box:9; }
          .box:nth-child(11) { --box:10; }
          .box:nth-child(12) { --box:11; }

          .box:nth-child(4n+1) {
              background: Tomato;
          }
          .box:nth-child(4n+2) {
              background: MediumSlateBlue;
          }
          .box:nth-child(4n+3) {
              background: Aquamarine;
          }
          .box:nth-child(4n) {
              background: Gold;
          }

          :root:has(input[value="green"]:checked){ --pick:#0fe837; }
          :root:has(input[value="red"]:checked){ --pick:#e73532; }
          :root:has(input[value="orange"]:checked){ --pick:#ff8400; }
          :root:has(input[value="magenta"]:checked){ --pick:#e918b8; }
          :root:has(input[value="blue"]:checked){ --pick:#2518df; }

          body:has(input[value="odd"]:checked) .box:nth-child(odd){ background:var(--pick); }
          body:has(input[value="even"]:checked) .box:nth-child(even){ background:var(--pick); }
          body:has(input[value="3n"]:checked) .box:nth-child(3n){ background:var(--pick); }
          body:has(input[value="first"]:checked) .box:first-child{ background:var(--pick); }
          body:has(input[value="last"]:checked) .box:last-child{ background:var(--pick); }
          body:has(input[value="n7"]:checked) .box:nth-child(n+7){ background:var(--pick); }
          body:has(input[value="n3"]:checked) .box:nth-child(-n+3){ background:var(--pick); }




          .btns {
              position:fixed;
              left: 12px;
              right: 12px;
              bottom: calc(12px + env(safe-area-inset-bottom,0px));
              display: flex;
              flex-wrap: wrap;
              gap: 6px;
              align-items: center;
              font-family: "D2Coding", monospace;
              font-size: 14px;
          }
          .btns input {
            position: absolute;
            opacity: 0;
            width: 1px;
            height: 1px;
            margin: 0;
          }
          .selectors {
            background: #FFF;
            color: #000;
            padding: 5px 9px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select:none;
          }
          .selectors:has(input:checked) {
            background: #000;
            color: #FFF;
          }
          .colorset {
            width: 26px;
            height: 26px;
            cursor: pointer;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,.25);
          }
          .selectors + .colorset { margin-left:10px; }
          .colorset:has(input:checked) {
            box-shadow:0 0 0 2px #FFFFFF,
            0 0 0 4px #111111;
          }
          .colorset.green { background: #0fe837; }
          .colorset.red { background: #e73532; }
          .colorset.orange { background: #ff8400; }
          .colorset.magenta { background: #e918b8; }
          .colorset.blue { background: #2518df; }
          .selectors:has(:focus-visible), .colorset:has(:focus-visible) { 
            outline: 3px solid #000;
            outline-offset: 2px;
          }

    </style>
    </head>
    <body>
        <div class="background">
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
        </div>

        <div class="btns">
            <label class="selectors">
              <input type="checkbox" value="odd">
              <span>:nth-child(odd)</span>
            </label>
            <label class="selectors">
              <input type="checkbox" value="even">
              <span>:nth-child(even)</span>
            </label>
            <label class="selectors">
              <input type="checkbox" value="3n">
              <span>:nth-child(3n)</span>
            </label>
            <label class="selectors">
              <input type="checkbox" value="first">
              <span>:first-child</span>
            </label>
            <label class="selectors">
              <input type="checkbox" value="last">
              <span>:last-child</span>
            </label>
            <label class="selectors">
              <input type="checkbox" value="n7">
              <span>:nth-child(n+7)</span>
            </label>
            <label class="selectors">
              <input type="checkbox" value="n3">
              <span>:nth-child(-n+3)</span>
            </label>

            <label class="colorset green">
              <input type="radio" name="color" value="green" checked>
            </label>
            <label class="colorset red">
              <input type="radio" name="color" value="red">
            </label>
            <label class="colorset orange">
              <input type="radio" name="color" value="orange">
            </label>
            <label class="colorset magenta">
              <input type="radio" name="color" value="magenta">
            </label>
            <label class="colorset blue">
              <input type="radio" name="color" value="blue">
            </label>
        </div>
    </body>
</html>
